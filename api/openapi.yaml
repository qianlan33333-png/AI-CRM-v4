          properties:
            completed_amount: {type: array, items: {$ref: "#/components/schemas/AdminOverviewMoney"}}
            completed_count: {type: integer, format: int64, minimum: 0}
            missing_completion_evidence_count: {type: integer, format: int64, minimum: 0}
            net_amount: {type: [array, "null"], items: {$ref: "#/components/schemas/AdminOverviewMoney"}}
            evidence: {type: string}
    AdminOverviewDistribution:
      allOf:
        - {$ref: "#/components/schemas/AdminOverviewSection"}
        - type: object
          required: [period_paid_sales_minor, period_initial_commission_minor, period_commission_count, current_unsettled_minor, current_settled_minor, current_exception_order_count, currency]
          properties:
            period_paid_sales_minor: {type: integer, format: int64, minimum: 0}
            period_initial_commission_minor: {type: integer, format: int64, minimum: 0}
