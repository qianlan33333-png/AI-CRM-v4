  /api/sidebar/v2/questionnaires:
    get: {operationId: listSidebarSurveyHistory, security: [{contextToken: []}], responses: {"200": {description: Bounded canonical Customer survey projection}}}
  /api/v1/customers/{customer_id}/survey-answers:
    parameters: [{name: customer_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}]
    get: {operationId: listCustomerSurveyAnswers, security: [{adminSession: []}], responses: {"200": {description: OneID customer survey history}}}
  /api/admin/orders:
    get:
      operationId: listLegacyOrders
      tags: [Transactions]
      security: [{adminSession: []}]
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
        - {name: provider, in: query, schema: {type: string, enum: [wechat, wechat_pay, wechat_shop, alipay]}}
        - {name: status, in: query, schema: {type: string, enum: [pending_payment, paid, partially_refunded, refunded, cancelled, payment_failed, closed]}}
        - {name: order_ref, in: query, schema: {type: string, maxLength: 200}}
        - {name: customer_id, in: query, schema: {$ref: "#/components/schemas/PositiveID"}}
        - {name: product, in: query, schema: {type: string, maxLength: 200}}
        - {name: created_from, in: query, schema: {type: string, format: date}}
        - {name: created_to, in: query, schema: {type: string, format: date}}
      responses: {"200": {description: Canonical order page, content: {application/json: {schema: {$ref: "#/components/schemas/TransactionOrderPage"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Unavailable"}}
  /api/admin/orders/{order_ref}:
    get:
      operationId: getLegacyOrder
      tags: [Transactions]
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/OrderReference"}]
      responses: {"200": {description: Unique canonical order, content: {application/json: {schema: {$ref: "#/components/schemas/TransactionOrder"}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Unavailable"}}
  /api/admin/orders/{order_ref}/items:
    get:
      operationId: getLegacyOrderItems
      tags: [Transactions]
      security: [{adminSession: []}]
      parameters: [{$ref: "#/components/parameters/OrderReference"}]
      responses: {"200": {description: Immutable item snapshots, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/TransactionOrderItem"}}}}}}}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}}
  /api/admin/order-imports/{mode}:
    post:
      operationId: executeOrderOnlyHistoryImport
      tags: [Transactions]
      description: Super-admin-only inspection, idempotent apply, or reconciliation of an exact WeChat Pay floating historical-order snapshot. This route never provisions OneID, Payment, Refund, or Provider effects.
      security: [{adminSession: [], csrfHeader: []}]
      parameters:
        - {name: mode, in: path, required: true, schema: {type: string, enum: [inspect, apply, reconcile]}}
        - {name: X-Manifest-SHA256, in: header, required: true, schema: {type: string, pattern: "^[0-9a-f]{64}$"}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
        - {name: X-Confirm-Apply, in: header, required: false, description: Required for apply and must equal the manifest run_key., schema: {type: string, minLength: 1, maxLength: 200}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, description: Strict aicrm-commerce-history-v3 order-only manifest, maxProperties: 8}}}}
      responses: {"200": {description: Safe aggregate result without raw transaction identifiers}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "413": {$ref: "#/components/responses/Error"}, "415": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Unavailable"}}
  /api/admin/refunds:
    get:
      operationId: listLegacyRefunds
      tags: [Transactions]
      security: [{adminSession: []}]
      parameters:
        - {name: provider, in: query, required: false, description: "When filtering an order detail, must be paired with order_no. all or omitted lists all local payment refunds; wechat_pay is a legacy query alias for wechat.", schema: {type: string, enum: [all, wechat, wechat_pay, wechat_shop]}}
        - {name: order_no, in: query, required: false, description: "Merchant order number; valid only with provider because the provider/order pair identifies one Payment.", schema: {type: string, minLength: 1, maxLength: 200}}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses: {"200": {description: Refund page. A scoped query returns refunds belonging only to the exact provider and merchant-order Payment., content: {application/json: {schema: {$ref: "#/components/schemas/LegacyOrderRefundPage"}}}}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}}
    post:
      operationId: createWechatShopRefundIntent
      tags: [Transactions]
      security: [{adminSession: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, order_no, product_id, sku_id, refund_count, refund_amount_total, reason_code, reason, transaction_id_confirmation, checked]
              properties:
                provider: {type: string, enum: [wechat_shop]}
                order_no: {type: string, minLength: 1, maxLength: 200}
                product_id: {type: string, minLength: 1, maxLength: 200}
                sku_id: {type: string, minLength: 1, maxLength: 200}
                refund_count: {type: integer, minimum: 1, maximum: 1000000}
                refund_amount_total: {type: integer, minimum: 1}
                reason_code: {type: string, enum: ["10000000", "10000001", "10000002", "10000006", "10000007", "10000008", "10000014", "10000015", "10000017", "10000021"]}
                reason: {type: string, minLength: 1, maxLength: 500}
                transaction_id_confirmation: {type: string, minLength: 1, maxLength: 200, description: "Existing WeChat Shop order confirmation: must exactly equal order_no. This Shop contract does not claim a verified WeChat Pay transaction_id."}
                checked: {type: boolean}
                operator: {type: string, maxLength: 200}
      responses: {"202": {description: WeChat Shop refund effect accepted atomically}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Unavailable"}}
  /api/admin/refunds/recovery:
    get:
      operationId: findRefundRecoveryReceipt
      tags: [Transactions]
      description: Read-only refund-recovery receipt lookup. The original Idempotency-Key is supplied only in a request header and is matched with the authenticated admin actor plus the exact provider/order Payment; it never replays a refund command or exposes its payload or key digest. actor_binding is a non-secret local-browser partition marker, never an authorization credential.
      security: [{adminSession: []}]
