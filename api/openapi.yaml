    get: {operationId: getSurveyOperations, security: [{adminSession: []}], responses: {"200": {description: External Effect intent and receipt state}}}
  /api/admin/questionnaires/{questionnaire_id}/operations/completion:
    parameters: [{name: questionnaire_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}]
    put:
      operationId: saveSurveyCompletionOperation
      description: Supports the retained navigation/channel payload and the current explicit completion-action editor. Stored redirects are resolved only through the declared safe target contract.
      security: [{adminSession: [], csrfHeader: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyCompletionOperationRequest"}}}}
      responses:
        "200": {description: Persisted local completion configuration, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyOperationConfigurationResponse"}}}}
        "400": {description: invalid_request or invalid_completion_action}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
