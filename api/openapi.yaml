      responses:
        '200':
          description: 超级管理员可读的脱敏治理结果；未知、未覆盖与正常分别表达
          headers:
            X-AICRM-Diagnostic-ID:
              description: 不透明的排查编号
              schema: {type: string, pattern: "^[a-f0-9]{32}$"}
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '400':
          description: 固定策略或请求字段无效
        '403':
          description: 权限或CSRF校验失败
        '409':
          description: 幂等摘要或记录版本冲突
