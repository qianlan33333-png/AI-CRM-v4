      allOf:
        - {$ref: "#/components/schemas/AdminOverviewSection"}
        - type: object
          required: [gross, order_count, trend]
          properties:
            gross: {type: array, items: {$ref: "#/components/schemas/AdminOverviewMoney"}}
            order_count: {type: integer, format: int64, minimum: 0, description: Distinct Payment business order_id values in the trustworthy paid_confirmed_at window.}
            distinct_canonical_payers:
              type: integer
              format: int64
              minimum: 0
              description: Distinct current canonical Customer roots for the historical paid payer set. Omitted when the bounded OneID root read is unavailable so clients cannot present an unknown count as zero.
            missing_payer_count: {type: integer, format: int64, minimum: 0}
            missing_confirmation_evidence_count: {type: integer, format: int64, minimum: 0}
            missing_confirmation_evidence_amount: {type: array, items: {$ref: "#/components/schemas/AdminOverviewMoney"}}
            trend: {type: array, items: {$ref: "#/components/schemas/AdminOverviewTrendPoint"}}
    AdminOverviewPaidRecord:
      type: object
      additionalProperties: false
      required: [provider, order_reference, payer_customer_id, amount_minor, currency, paid_confirmed_at]
      properties:
        provider: {type: string, enum: [wechat_pay, wechat_shop], description: Payment provider. Together with order_reference it identifies the existing provider-scoped admin Order detail.}
        order_reference: {type: string, minLength: 1, maxLength: 256}
        payer_customer_id: {type: [integer, "null"], format: int64, minimum: 1, description: Historical Customer ID at payment time, not a current canonical root.}
