  /api/admin/questionnaires/{questionnaire_id}/operations/external-push:
    parameters: [{name: questionnaire_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}]
    put:
      operationId: saveSurveyExternalPushOperation
      description: Legacy toggle/reference writers may omit metadata and configuration_version; metadata writers must send the readback configuration_version and receive configuration_conflict on drift.
