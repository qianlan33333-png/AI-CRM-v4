    get: {operationId: getSurveyQuestionnaire, security: [{adminSession: []}], responses: {"200": {description: Survey definition}}}
    put: {operationId: replaceSurveyQuestionnaire, security: [{adminSession: [], csrfHeader: []}], parameters: [{$ref: "#/components/parameters/RequiredIdempotencyKey"}], requestBody: {required: true, content: {application/json: {schema: {type: object}}}}, responses: {"200": {description: New mutable definition version}}}
    delete:
      operationId: archiveSurveyQuestionnaire
