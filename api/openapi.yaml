    post: {operationId: reconcileSurveySubmissionExternalPush, security: [{adminSession: [], csrfHeader: []}], responses: {"503": {description: Provider disabled by default}}}
  /api/public/questionnaires/{slug}:
    parameters: [{name: slug, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,127}$'}}]
    get:
      operationId: getPublicSurvey
      tags: [SurveyPublic]
      description: Requires a valid HttpOnly Survey OAuth session. A Customer that has already submitted receives already_submitted and a safe completion action instead of a definition.
      responses:
        "200": {description: Published immutable survey, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicDefinition"}}}}
        "401": {description: survey_oauth_required, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicError"}}}}
        "409": {description: survey_identity_conflict or already_submitted, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicConflictError"}}}}
        "503": {description: survey_oauth_unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicError"}}}}
  /api/public/questionnaires/{slug}/submissions:
    parameters: [{name: slug, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,127}$'}}]
    post:
      operationId: submitPublicSurvey
      tags: [SurveyPublic]
      description: Requires a resolved Customer from a valid HttpOnly Survey OAuth session. Mobile answers accept only 11-digit mainland numbers and remain declared evidence. The same submission key and payload replays its receipt; a different key after a successful claim returns already_submitted.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicSubmissionRequest"}}}}
      responses:
        "201": {description: Idempotent local submission receipt and safe completion action, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicSubmissionResponse"}}}}
        "400": {description: invalid_public_input, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicError"}}}}
        "401": {description: survey_oauth_required, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicError"}}}}
        "409": {description: "survey_identity_conflict, idempotency_conflict, or already_submitted. already_submitted includes completion_action.", content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicConflictError"}}}}
        "503": {description: survey_oauth_unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicError"}}}}
  /api/public/survey-submission-results/query:
    post:
      operationId: queryPublicSurveyResult
      tags: [SurveyPublic]
      description: New resolved submissions require the same Customer OAuth session; historical anonymous result tokens remain read-only compatible.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicResultQueryRequest"}}}}
      responses:
        "200": {description: Result token projection, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicResult"}}}}
        "401": {description: survey_oauth_required, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicError"}}}}
        "403": {description: survey_result_forbidden, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicError"}}}}
        "409": {description: survey_identity_conflict, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicError"}}}}
        "503": {description: survey_oauth_unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicError"}}}}
  /api/h5/surveys/oauth/start:
    get: {operationId: startSurveyOAuth, description: User-click initiated snsapi_userinfo authorization. Display mode is derived from the published server-side definition., parameters: [{name: slug, in: query, required: true, schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,127}$'}}], responses: {"303": {description: Redirect to WeChat OAuth}, "400": {description: survey_wechat_required}, "404": {description: questionnaire_not_found}, "503": {description: survey_oauth_unavailable}}}
  /api/h5/surveys/oauth/callback:
    get: {operationId: completeSurveyOAuth, parameters: [{name: code, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 512}}, {name: state, in: query, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}}], responses: {"303": {description: Verified identity session and safe H5 redirect; the session cookie is HttpOnly Secure SameSite Lax}}}
  /api/h5/surveys/session:
    get:
      operationId: getSurveyOAuthSession
      tags: [SurveyPublic]
      description: Returns only authorization state, display mode, submitted state, and the safe completion action; never returns Customer ID, OpenID, UnionID, submission ID, or result token.
      parameters: [{name: slug, in: query, required: true, schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,127}$'}}]
      responses:
        "200": {description: Safe OAuth session state, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicSession"}}}}
        "401": {description: survey_oauth_required, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicError"}}}}
        "409": {description: survey_identity_conflict, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicError"}}}}
        "503": {description: survey_oauth_unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyPublicError"}}}}
  /api/admin/survey-history/submissions:
    get: {operationId: listSurveyUnresolvedHistory, security: [{adminSession: []}], responses: {"200": {description: Read-only unresolved migrated submissions}}}
  /api/admin/survey-history/submissions/{submission_id}:
    parameters: [{name: submission_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}]
    get: {operationId: getSurveyUnresolvedHistory, security: [{adminSession: []}], responses: {"200": {description: Read-only migrated submission}}}
  /api/admin/survey-history/submissions/{submission_id}/answers:
    parameters: [{name: submission_id, in: path, required: true, schema: {$ref: "#/components/schemas/PositiveID"}}]
