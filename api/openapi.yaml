          application/json:
            schema: {$ref: "#/components/schemas/SurveyExternalPushOperationRequest"}
      responses:
        "200": {description: Persisted local configuration readback, content: {application/json: {schema: {$ref: "#/components/schemas/SurveyOperationConfigurationResponse"}}}}
        "400": {description: "invalid_request, invalid_custom_params, configuration_version_required, or configuration_reference_unavailable"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {description: configuration_conflict}
