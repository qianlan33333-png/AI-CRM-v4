      type: object
      additionalProperties: false
      required: [range, items, next_cursor]
      properties:
        range: {$ref: "#/components/schemas/AdminOverviewRange"}
        items: {type: array, maxItems: 25, items: {$ref: "#/components/schemas/AdminOverviewPaidRecord"}}
        next_cursor: {type: string, maxLength: 2048, description: Empty when no later page exists; otherwise use alone as cursor query parameter.}
    AdminOverviewCustomers:
      allOf:
        - {$ref: "#/components/schemas/AdminOverviewSection"}
        - type: object
          required: [new_canonical_customers, historical_excluded]
          properties:
            new_canonical_customers: {type: integer, format: int64, minimum: 0}
            historical_excluded: {type: integer, format: int64, minimum: 0}
            unknown_source_count: {type: integer, format: int64, minimum: 0}
            evidence: {type: string}
