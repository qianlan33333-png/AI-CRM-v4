                expected_version: {type: integer, minimum: 1}
      responses: {"200": {description: Questionnaire archived; public submissions stop and historical facts remain}, "400": {$ref: "#/components/responses/Error"}, "401": {$ref: "#/components/responses/Error"}, "403": {$ref: "#/components/responses/Error"}, "404": {$ref: "#/components/responses/Error"}, "409": {$ref: "#/components/responses/Error"}, "503": {$ref: "#/components/responses/Error"}}
  /api/admin/questionnaires/{questionnaire_id}/duplicate:
