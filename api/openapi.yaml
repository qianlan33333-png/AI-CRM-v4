    AdminOverview:
      type: object
      additionalProperties: false
      required: [range, contract, paid, customers, refunds, distribution, todos]
      properties:
        range: {$ref: "#/components/schemas/AdminOverviewRange"}
        contract: {$ref: "#/components/schemas/AdminOverviewContract"}
        paid: {$ref: "#/components/schemas/AdminOverviewPaid"}
        customers: {$ref: "#/components/schemas/AdminOverviewCustomers"}
        refunds: {$ref: "#/components/schemas/AdminOverviewRefunds"}
        distribution: {$ref: "#/components/schemas/AdminOverviewDistribution"}
        todos: {$ref: "#/components/schemas/AdminOverviewTodos"}
    AdminOverviewRange:
      type: object
      additionalProperties: false
      required: [period, timezone, start, end]
      properties:
        period: {type: string, enum: [today, 7d, 30d, custom]}
        timezone: {const: Asia/Shanghai}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time, description: Exclusive range end.}
    AdminOverviewContract:
      type: object
      additionalProperties: false
      required: [scope, paid_gross, paid_payers, new_customers, refunds, distribution, cross_domain_reads]
      properties:
        scope: {const: admin_authorized_global}
        paid_gross: {type: string}
        paid_payers: {type: string}
        new_customers: {type: string}
        refunds: {type: string}
        distribution: {type: string}
        cross_domain_reads: {type: string}
    AdminOverviewSection:
      type: object
      additionalProperties: false
      required: [status, as_of, scope]
      properties:
        status: {type: string, enum: [ready, zero, data_missing, failed]}
        as_of: {type: string, format: date-time, description: Actual completion observation time for this owner section.}
        scope: {const: admin_authorized_global}
        reason_code: {type: string}
    AdminOverviewMoney:
      type: object
      additionalProperties: false
      required: [amount_minor, currency]
      properties:
        amount_minor: {type: integer, format: int64}
        currency: {type: string, minLength: 1, maxLength: 16}
    AdminOverviewTrendPoint:
      type: object
      additionalProperties: false
      required: [date, gross, order_count]
      properties:
        date: {type: string, format: date}
        gross: {type: array, items: {$ref: "#/components/schemas/AdminOverviewMoney"}}
        order_count: {type: integer, format: int64, minimum: 0}
