      security: [{adminSession: []}]
      parameters:
        - {name: period, in: query, required: false, description: Required on the first page. Omit it when continuing with cursor., schema: {type: string, enum: [today, 7d, 30d, custom]}}
        - {name: from, in: query, description: Required only on a first custom-range page. Inclusive Beijing calendar date., schema: {type: string, format: date}}
        - {name: to, in: query, description: Required only on a first custom-range page and must be on or after from. Inclusive Beijing calendar date., schema: {type: string, format: date}}
        - {name: cursor, in: query, description: Opaque continuation from this endpoint. It must be the only query parameter on later pages., schema: {type: string, minLength: 1, maxLength: 2048}}
      responses:
        "200": {description: Confirmed-payment record page for the selected operating range., content: {application/json: {schema: {$ref: "#/components/schemas/AdminOverviewPaidRecordsPage"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Unavailable"}
