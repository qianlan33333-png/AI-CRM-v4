  /api/admin/ops-retention/resources:
    get:
      operationId: opsRetentionResources
      summary: 已登记资源的生命周期分类与覆盖边界
      description: 仅超级管理员可读。返回完整已提交登记簿及运行时策略绑定，不扫描数据库内容或主机文件，不执行清理。不接受查询参数；客户端在完整返回集内筛选分页。已排程不是清理成功，白名单执行健康不代表全资源覆盖，原生和主机执行必须另查证据。
      tags: [AdminOps]
      security:
        - adminSession: []
      responses:
        '200':
          description: 只读登记分类、保护边界和覆盖缺口，不包含业务数据或凭据
          headers:
            Cache-Control:
              schema: {type: string, const: 'private, no-store'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpsRetentionCoverage'}
        '400':
          description: 不接受任何查询参数
        '403':
          description: 未登录或不是超级管理员
        '503':
          description: 登记快照不可读或不完整，不能认定已覆盖
