name: ci

on:
  workflow_dispatch:
    inputs:
      force_full:
        description: Run all checks even when an identical merged tree has PR evidence
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Keep main checks non-cancellable; only obsolete PR runs are cancelled.
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      full: ${{ steps.finalize.outputs.full }}
      verified_run: ${{ steps.plan.outputs.verified_run }}
      mode: ${{ steps.finalize.outputs.mode }}
      lanes: ${{ steps.finalize.outputs.lanes }}
      checks: ${{ steps.finalize.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate migration sequence and destructive SQL
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/check-migration-sequence.py --base "${GITHUB_BASE_SHA:-origin/main}"
      - name: Require an installer for Excel dependency updates
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --quiet "$GITHUB_BASE_SHA"...HEAD -- components/excel-batches/requirements.txt; then
            echo 'Excel dependency changes need a portable staged venv installer before merge.' >&2
            exit 1
          fi
      - id: plan
        name: Verify whether main is exactly the tested PR tree
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ inputs.force_full || false }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/verification.py plan
      - id: impact
        name: Select affected verification lanes
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ github.event_name == 'pull_request' && steps.plan.outputs.full == 'true' }}
        run: |
          set -euo pipefail
          full_selection='{"mode":"full","lanes":["preflight","backend","frontend","browser","archive-sdk"],"checks":[],"reason":"impact-analysis-failed"}'
          if python3 scripts/ci/governance_impact.py --out "$RUNNER_TEMP/impact.json"; then
            if selection="$(python3 scripts/ci/impact_selection.py "$RUNNER_TEMP/impact.json")"; then
              :
            else
              echo 'Impact selection failed; scheduling every verification lane.' >> "$GITHUB_STEP_SUMMARY"
              selection="$full_selection"
            fi
          else
            echo 'Impact analysis failed; scheduling every verification lane. The governance gate will retain the failure.' >> "$GITHUB_STEP_SUMMARY"
            selection="$full_selection"
          fi
          echo "selection=$selection" >> "$GITHUB_STEP_SUMMARY"
          python3 - "$selection" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          selection = json.loads(sys.argv[1])
          with open(sys.argv[2], "a") as output:
              output.write("mode=" + selection["mode"] + "\n")
              output.write("lanes=" + json.dumps(selection["lanes"], separators=(",", ":")) + "\n")
              output.write("checks=" + json.dumps(selection.get("checks", []), separators=(",", ":")) + "\n")
          PY
      - id: finalize
        name: Publish verification plan
        env:
          IMPACT_MODE: ${{ steps.impact.outputs.mode }}
          IMPACT_LANES: ${{ steps.impact.outputs.lanes }}
          IMPACT_CHECKS: ${{ steps.impact.outputs.checks }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.plan.outputs.mode }}" == "release" ]]; then
            echo 'mode=release' >> "$GITHUB_OUTPUT"
            echo 'lanes=[]' >> "$GITHUB_OUTPUT"
            echo 'checks=[]' >> "$GITHUB_OUTPUT"
            echo 'full=false' >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" || "${{ github.ref }}" == "refs/heads/main" || "${{ inputs.force_full }}" == "true" ]]; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            echo 'lanes=["preflight","backend","frontend","browser","archive-sdk"]' >> "$GITHUB_OUTPUT"
            echo 'checks=[]' >> "$GITHUB_OUTPUT"
            echo 'full=true' >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.plan.outputs.mode }}" == "light" ]]; then
            echo 'mode=light' >> "$GITHUB_OUTPUT"
            echo 'lanes=[]' >> "$GITHUB_OUTPUT"
            echo 'checks=[]' >> "$GITHUB_OUTPUT"
            echo 'full=false' >> "$GITHUB_OUTPUT"
          elif [[ "$IMPACT_MODE" == "targeted" ]]; then
            echo 'mode=targeted' >> "$GITHUB_OUTPUT"
            printf 'lanes=%s\n' "$IMPACT_LANES" >> "$GITHUB_OUTPUT"
            printf 'checks=%s\n' "$IMPACT_CHECKS" >> "$GITHUB_OUTPUT"
            echo 'full=false' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            echo 'lanes=["preflight","backend","frontend","browser","archive-sdk"]' >> "$GITHUB_OUTPUT"
            echo 'checks=[]' >> "$GITHUB_OUTPUT"
            echo 'full=true' >> "$GITHUB_OUTPUT"
          fi

  preflight:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'preflight')
    outputs:
      classification: ${{ steps.receipt.outputs.classification }}
      observations: ${{ steps.receipt.outputs.observations }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - id: setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24.18.0'}
      - id: verify
        if: ${{ steps.checkout.outcome == 'success' && steps.setup-go.outcome == 'success' && steps.setup-node.outcome == 'success' }}
        name: Run canonical preflight verification lane
        env:
          # workflow_dispatch has no event.before; an empty value deliberately
          # selects the checked-out HEAD parent in check-dedup-base-diff.sh.
          AICRM_DEDUP_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
          AICRM_DEDUP_HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/ci/quality_lanes.py preflight --report-dir "$RUNNER_TEMP/preflight"
      - id: receipt
        if: always()
        name: Record structured preflight receipt
        env:
          SETUP_CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_GO: ${{ steps.setup-go.outcome }}
          SETUP_NODE: ${{ steps.setup-node.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          JOB: ${{ job.status }}
        run: python3 scripts/ci/quality_report.py receipt --lane preflight --setup "checkout=$SETUP_CHECKOUT" --setup "go=$SETUP_GO" --setup "node=$SETUP_NODE" --verification "$VERIFY" --job "$JOB" --out "$RUNNER_TEMP/ci-receipts/preflight.json"
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/preflight
            ${{ runner.temp }}/ci-receipts/preflight.json
          retention-days: 14

  backend:
    needs: [plan, preflight]
    if: contains(fromJSON(needs.plan.outputs.lanes), 'backend')
    outputs:
      classification: ${{ steps.receipt.outputs.classification }}
      observations: ${{ steps.receipt.outputs.observations }}
    runs-on: ubuntu-latest
    # Bound the full serial race suite plus setup/vet; each package keeps its 15m timeout.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aicrm_test_acceptance_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d aicrm_test_acceptance_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AICRM_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_test_acceptance_test?sslmode=disable
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/ci-setup
        with:
          lane: race
      - id: verify
        if: ${{ steps.checkout.outcome == 'success' && steps.setup.outcome == 'success' }}
        name: Run canonical backend verification lane
        run: python3 scripts/ci/quality_lanes.py backend --report-dir "$RUNNER_TEMP/quality-lanes/backend"
        env:
          AICRM_CI_FOCUS_CHECKS: ${{ needs.plan.outputs.checks }}
      - id: receipt
        if: always()
        name: Record structured backend receipt
        env:
          SETUP_CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP: ${{ steps.setup.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          JOB: ${{ job.status }}
        run: python3 scripts/ci/quality_report.py receipt --lane backend --setup "checkout=$SETUP_CHECKOUT" --setup "ci-setup=$SETUP" --verification "$VERIFY" --job "$JOB" --out "$RUNNER_TEMP/ci-receipts/backend.json"
      - if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ci-receipt-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-receipts/backend.json
          if-no-files-found: warn
          retention-days: 14

  frontend:
    needs: [plan, preflight]
    if: contains(fromJSON(needs.plan.outputs.lanes), 'frontend')
    outputs:
      classification: ${{ steps.receipt.outputs.classification }}
      observations: ${{ steps.receipt.outputs.observations }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/ci-setup
        with:
          lane: frontend
      - id: verify
        if: ${{ steps.checkout.outcome == 'success' && steps.setup.outcome == 'success' }}
        name: Run canonical frontend verification lane
        run: python3 scripts/ci/quality_lanes.py frontend --report-dir "$RUNNER_TEMP/quality-lanes/frontend"
        env:
          AICRM_CI_FOCUS_CHECKS: ${{ needs.plan.outputs.checks }}
      - id: receipt
        if: always()
        name: Record structured frontend receipt
        env:
          SETUP_CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP: ${{ steps.setup.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          JOB: ${{ job.status }}
        run: python3 scripts/ci/quality_report.py receipt --lane frontend --setup "checkout=$SETUP_CHECKOUT" --setup "ci-setup=$SETUP" --verification "$VERIFY" --job "$JOB" --out "$RUNNER_TEMP/ci-receipts/frontend.json"
      - if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ci-receipt-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-receipts/frontend.json
          if-no-files-found: warn
          retention-days: 14

  browser:
    needs: [plan, preflight]
    if: contains(fromJSON(needs.plan.outputs.lanes), 'browser')
    outputs:
      classification: ${{ steps.receipt.outputs.classification }}
      observations: ${{ steps.receipt.outputs.observations }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aicrm_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d aicrm_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AICRM_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aicrm_ci?sslmode=disable
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/ci-setup
        with:
          lane: browser
      - id: setup-browser
        name: Install required Chromium fonts
        run: |
          sudo apt-get update || true
          sudo apt-get install --no-install-recommends --yes fonts-noto-cjk || true
          fc-match "Noto Sans CJK SC" || true
          command -v google-chrome
      - id: verify
        if: ${{ steps.checkout.outcome == 'success' && steps.setup.outcome == 'success' && steps.setup-browser.outcome == 'success' }}
        name: Run canonical browser verification lane
        env:
          AICRM_REQUIRE_CHROMIUM_JOURNEY: '1'
          AICRM_ADMIN_LAYOUT_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/admin-shell-layout
          AICRM_SIDEBAR_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/sidebar-standard
          AICRM_CI_FOCUS_CHECKS: ${{ needs.plan.outputs.checks }}
        run: python3 scripts/ci/quality_lanes.py browser --report-dir "$RUNNER_TEMP/browser-evidence"
      - id: receipt
        if: always()
        name: Record structured browser receipt
        env:
          SETUP_CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP: ${{ steps.setup.outcome }}
          SETUP_BROWSER: ${{ steps.setup-browser.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          JOB: ${{ job.status }}
        run: python3 scripts/ci/quality_report.py receipt --lane browser --setup "checkout=$SETUP_CHECKOUT" --setup "ci-setup=$SETUP" --setup "browser-runtime=$SETUP_BROWSER" --verification "$VERIFY" --job "$JOB" --out "$RUNNER_TEMP/ci-receipts/browser.json"
      - name: Upload browser results and screenshots
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: required-browser-tests-${{ github.sha }}
          path: |
            ${{ runner.temp }}/browser-evidence
            artifacts/admin-shell-layout
            artifacts/sidebar-standard
            ${{ runner.temp }}/ci-receipts/browser.json
          retention-days: 14

  archive-sdk:
    needs: [plan, preflight]
    if: contains(fromJSON(needs.plan.outputs.lanes), 'archive-sdk')
    outputs:
      classification: ${{ steps.receipt.outputs.classification }}
      observations: ${{ steps.receipt.outputs.observations }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/ci-setup
        with:
          lane: sdk
      - id: verify
        if: ${{ steps.checkout.outcome == 'success' && steps.setup.outcome == 'success' }}
        name: Run canonical archive SDK verification lane
        run: python3 scripts/ci/quality_lanes.py archive-sdk --report-dir "$RUNNER_TEMP/quality-lanes/archive-sdk"
        env:
          AICRM_CI_FOCUS_CHECKS: ${{ needs.plan.outputs.checks }}
      - id: receipt
        if: always()
        name: Record structured archive SDK receipt
        env:
          SETUP_CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP: ${{ steps.setup.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          JOB: ${{ job.status }}
        run: python3 scripts/ci/quality_report.py receipt --lane archive-sdk --setup "checkout=$SETUP_CHECKOUT" --setup "ci-setup=$SETUP" --verification "$VERIFY" --job "$JOB" --out "$RUNNER_TEMP/ci-receipts/archive-sdk.json"
      - if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ci-receipt-archive-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-receipts/archive-sdk.json
          if-no-files-found: warn
          retention-days: 14

  governance:
    # Always run, including main's verified-tree reuse: vulnerability data and
    # PR review declarations are external facts, not immutable tree evidence.
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/governance-setup
      - name: Validate governance rules with adversarial regression cases
        run: python3 -m unittest discover -s scripts/ci -p test_governance.py -v
      - id: impact
        name: Map source changes to affected capabilities and existing journeys
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/governance_impact.py --out "$RUNNER_TEMP/governance/impact.json"
      - name: Gate API compatibility, reachable vulnerabilities and redacted secret scan
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.setup.outcome == 'success' }}
        env:
          GOVERNANCE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          base="$GOVERNANCE_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="HEAD^"; fi
          python3 scripts/ci/governance_security.py scan --base "$base" --tools-dir "$RUNNER_TEMP/governance-tools" --out "$RUNNER_TEMP/governance/security"
      - name: Upload exact-head impact and security evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: governance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/governance
          if-no-files-found: error
          retention-days: 30

  check:
    if: always()
    needs: [plan, preflight, backend, frontend, browser, archive-sdk, governance]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require full success or a verified identical merged tree
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/governance_impact.py --gate
          python3 scripts/ci/local_first_gate.py
          python3 scripts/ci/verification.py gate
      - name: Record the exact tested tree for main
        if: needs.plan.outputs.full == 'true'
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ci-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification.json
          if-no-files-found: error
          retention-days: 90

  quality-report:
    # This is read-only reporting. It is intentionally outside the check gate:
    # an unavailable history query must never make a failed verification green.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [plan, preflight, backend, frontend, browser, archive-sdk, check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Summarize exact PR attempts and structured lane outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/quality_report.py summary --repo "$GITHUB_REPOSITORY" --pr "${{ github.event.pull_request.number }}" --head "${{ github.event.pull_request.head.sha }}" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --needs "$CI_NEEDS" --out "$RUNNER_TEMP/ci-quality-summary.json"
      - name: Upload read-only CI quality summary
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: ci-quality-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-quality-summary.json
          if-no-files-found: warn
          retention-days: 90
